[project]
name = "afk-stages-bot"
version = "1.0.0"
description = "Automatizador inteligente para AFK Journey Stages"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "pyautogui>=0.9.54",
    "pillow>=10.0.0",
    "pygetwindow>=0.0.9",
    "pywin32>=306",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E402", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
